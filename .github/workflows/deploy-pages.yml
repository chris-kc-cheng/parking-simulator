name: Publish simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install version 2 dependencies
        run: npm run setup
      - name: Build static application
        run: npm run build
      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
      - name: Show Pages activation instructions
        if: always()
        run: |
          {
            echo "## Published to the gh-pages branch"
            echo
            echo "The site files are ready. If the public URL shows **Site not found**,"
            echo "open [Settings → Pages](https://github.com/${GITHUB_REPOSITORY}/settings/pages),"
            echo "choose **Deploy from a branch**, select **gh-pages** and **/(root)**, then save."
            echo "This one-time repository setting cannot be changed by GITHUB_TOKEN."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify compiled public application
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent "${SITE_URL}v2/" | grep -Eq 'src="\./assets/[^" ]+\.js"'; then
              echo "Compiled v2 is live at ${SITE_URL}v2/"
              exit 0
            fi
            echo "Waiting for compiled v2 (attempt $attempt)..."
            sleep 12
          done
          echo "::error::Pages must serve the gh-pages branch, not main. Raw TypeScript cannot run in the browser."
          exit 1
