name: Publish simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build static application
        run: npm run build
      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
      - name: Show Pages activation instructions
        if: always()
        run: |
          {
            echo "## Published to the gh-pages branch"
            echo
            echo "The site files are ready. If the public URL shows **Site not found**,"
            echo "open [Settings → Pages](https://github.com/${GITHUB_REPOSITORY}/settings/pages),"
            echo "choose **Deploy from a branch**, select **gh-pages** and **/(root)**, then save."
            echo "This one-time repository setting cannot be changed by GITHUB_TOKEN."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Publishing a branch and enabling a Pages site are separate GitHub
          # operations. Do not report a successful deployment while Pages is
          # still disabled at repository level.
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$SITE_URL")"
            if [ "$status" = 200 ]; then
              echo "Published site is live at $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt: $SITE_URL returned HTTP $status; waiting for Pages..."
            sleep 12
          done
          echo "::error title=GitHub Pages is not enabled::The gh-pages branch was published, but GitHub is not serving it. Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and select Deploy from a branch → gh-pages → /(root)."
          exit 1
